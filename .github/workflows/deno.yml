एक जंगल में टिंकू नाम का तोता रहता था। गर्मी बहुत ज़्यादा थी, सब प्यासे और परेशान थे। टिंकू ने अक्ल लगाई। वह पहाड़ से बर्फ के छोटे टुकड़े लाया और जंगल में बेचने लगा।
जानवर ठंडी बर्फ लेकर खुश हो गए।
टिंकू ने जो पैसे कमाए, उनसे अपना छोटा सा घर चलाया और सबकी मदद भी की।
सबने सीखा कि अक्ल और मेहनत से हर मुश्किल आसान हो जाती है। 🦜❄️
